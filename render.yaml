services:
  - type: web
    name: smartot-command
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: local
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
